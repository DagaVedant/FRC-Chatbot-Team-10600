<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avocado Admin</title>
<style>
  :root { --green:#00ff41; --bg:#0a0a0a; --gray:#1a1a1a; --border:#2a2a2a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:#e0e0e0; font-family:'Segoe UI',sans-serif; padding:24px; }
  h1 { color:var(--green); font-size:1.4rem; margin-bottom:4px; text-shadow:0 0 10px var(--green); }
  .sub { color:#555; font-size:0.75rem; text-transform:uppercase; letter-spacing:.1em; margin-bottom:24px; }
  .card { background:var(--gray); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:20px; }
  h2 { color:var(--green); font-size:1rem; margin-bottom:12px; }
  textarea { width:100%; background:#060f08; border:1px solid var(--border); color:#e0e0e0;
    border-radius:6px; padding:12px; font-family:monospace; font-size:0.82rem;
    resize:vertical; min-height:220px; outline:none; }
  textarea:focus { border-color:var(--green); }
  .row { display:flex; gap:10px; margin-top:10px; }
  button { background:var(--green); color:#000; border:none; border-radius:6px;
    padding:9px 20px; font-weight:700; font-size:0.85rem; cursor:pointer; }
  button:hover { opacity:.85; }
  button.danger { background:#ff4444; color:#fff; }
  .msg { margin-top:8px; font-size:0.8rem; color:var(--green); min-height:18px; }
  .msg.err { color:#ff4444; }
  #login { max-width:360px; margin:80px auto; text-align:center; }
  #login input { width:100%; background:var(--gray); border:1px solid var(--border);
    color:#e0e0e0; border-radius:6px; padding:10px 14px; font-size:0.95rem;
    outline:none; margin:16px 0 10px; }
  #login input:focus { border-color:var(--green); }
  .stat { display:inline-block; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; padding:8px 16px; font-size:0.78rem; margin-right:8px; margin-bottom:8px; }
  .stat span { color:var(--green); font-weight:700; font-size:1.1rem; display:block; }
</style>
</head>
<body>
<div id="login">
  <h1>AVOCADO ADMIN</h1>
  <p class="sub">Two Steps Ahead · FRC 10600</p>
  <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()" style="width:100%">Enter</button>
  <div class="msg err" id="login-err"></div>
</div>

<div id="panel" style="display:none;max-width:860px;margin:0 auto;">
  <h1>AVOCADO ADMIN</h1>
  <p class="sub">Two Steps Ahead · FRC 10600 &nbsp;·&nbsp; <a href="/" style="color:#555">Back to chat</a></p>

  <div class="card">
    <h2>System Status</h2>
    <div id="stats">Loading...</div>
    <div class="row"><button onclick="loadStats()">Refresh</button></div>
  </div>

  <div class="card">
    <h2>Robot Data</h2>
    <textarea id="robot-data" placeholder="Loading..."></textarea>
    <div class="row">
      <button onclick="saveRobot()">Save & Reload</button>
    </div>
    <div class="msg" id="robot-msg"></div>
  </div>

  <div class="card">
    <h2>Dictionary (JSON)</h2>
    <textarea id="dict-data" placeholder="Loading..." style="min-height:300px;"></textarea>
    <div class="row">
      <button onclick="saveDict()">Save & Reload</button>
    </div>
    <div class="msg" id="dict-msg"></div>
  </div>

  <div class="card">
    <h2>Danger Zone</h2>
    <div class="row">
      <button class="danger" onclick="clearRAG()">Clear RAG Index</button>
      <button class="danger" onclick="clearSessions()">Clear All Sessions</button>
    </div>
    <div class="msg" id="danger-msg"></div>
  </div>
</div>

<script>
let token = '';

function login() {
  const pw = document.getElementById('pw').value;
  fetch('/admin/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password: pw})
  }).then(r=>r.json()).then(d=>{
    if (d.token) {
      token = d.token;
      document.getElementById('login').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      loadAll();
    } else {
      document.getElementById('login-err').textContent = 'Wrong password';
    }
  });
}

function authFetch(url, opts={}) {
  opts.headers = {...(opts.headers||{}), 'X-Admin-Token': token};
  return fetch(url, opts);
}

function loadAll() { loadStats(); loadRobot(); loadDict(); }

function loadStats() {
  authFetch('/admin/stats').then(r=>r.json()).then(d=>{
    document.getElementById('stats').innerHTML =
      `<div class="stat">RAG Chunks<span>${d.rag_chunks}</span></div>` +
      `<div class="stat">Active Sessions<span>${d.active_sessions}</span></div>` +
      `<div class="stat">Dictionary Entries<span>${d.dict_entries}</span></div>` +
      `<div class="stat">Ollama<span>${d.ollama}</span></div>` +
      `<div class="stat">Model<span>${d.model}</span></div>`;
  });
}

function loadRobot() {
  authFetch('/admin/robot-data').then(r=>r.json()).then(d=>{
    document.getElementById('robot-data').value = d.content || '';
  });
}

function loadDict() {
  authFetch('/admin/dictionary').then(r=>r.json()).then(d=>{
    document.getElementById('dict-data').value = JSON.stringify(d.content, null, 2);
  });
}

function saveRobot() {
  const content = document.getElementById('robot-data').value;
  authFetch('/admin/robot-data', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({content})
  }).then(r=>r.json()).then(d=>{
    const el = document.getElementById('robot-msg');
    el.textContent = d.message || d.error;
    el.className = 'msg' + (d.error ? ' err' : '');
    if (!d.error) loadStats();
  });
}

function saveDict() {
  let parsed;
  try { parsed = JSON.parse(document.getElementById('dict-data').value); }
  catch(e) { document.getElementById('dict-msg').textContent='Invalid JSON: '+e.message; return; }
  authFetch('/admin/dictionary', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({content: parsed})
  }).then(r=>r.json()).then(d=>{
    const el = document.getElementById('dict-msg');
    el.textContent = d.message || d.error;
    el.className = 'msg' + (d.error ? ' err' : '');
    if (!d.error) loadStats();
  });
}

function clearRAG() {
  if (!confirm('Clear the entire RAG index?')) return;
  authFetch('/ingest', {method:'DELETE'}).then(r=>r.json()).then(d=>{
    document.getElementById('danger-msg').textContent = d.message;
    loadStats();
  });
}

function clearSessions() {
  if (!confirm('Clear all conversation sessions?')) return;
  authFetch('/admin/clear-sessions', {method:'POST'}).then(r=>r.json()).then(d=>{
    document.getElementById('danger-msg').textContent = d.message;
    loadStats();
  });
}
</script>
</body>
</html>
